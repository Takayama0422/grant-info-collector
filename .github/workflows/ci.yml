name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    name: 構文チェックとテスト (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: 構文チェック (node --check)
        run: npm run validate

      - name: テストを実行
        run: npm test
